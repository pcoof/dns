name: Build and Release DNS Tester

on:
  push:
    tags:
      - 'v*'
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.13'
  APP_NAME: 'DNS-Tester'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true
        
    - name: Install dependencies
      run: |
        uv sync --frozen
        
    - name: Build executable with PyInstaller
      run: |
        Write-Host "🔨 构建可执行文件..."
        uv run pyinstaller --onefile --noconsole --icon=icon.ico --name="${{ env.APP_NAME }}" `
          --add-data="icon.ico;." `
          --hidden-import=tkinter `
          --hidden-import=tkinter.ttk `
          --hidden-import=ttkbootstrap `
          --hidden-import=dns `
          --hidden-import=dns.resolver `
          --hidden-import=pythoncom `
          --hidden-import=win32api `
          --hidden-import=win32con `
          main.py
        
    - name: Verify executable
      run: |
        if (Test-Path "dist\${{ env.APP_NAME }}.exe") {
          $fileSize = (Get-Item "dist\${{ env.APP_NAME }}.exe").Length / 1MB
          Write-Host "✅ 可执行文件构建成功，大小: $([math]::Round($fileSize, 2)) MB"
          
          # 检查文件属性
          Get-ItemProperty "dist\${{ env.APP_NAME }}.exe" | Select-Object Name, Length, CreationTime
        } else {
          Write-Error "❌ 可执行文件构建失败"
          exit 1
        }
      shell: powershell
        
    - name: Setup Inno Setup
      run: |
        Write-Host "📦 下载并安装 Inno Setup..."
        $innoUrl = "https://jrsoftware.org/download.php/is.exe"
        Invoke-WebRequest -Uri $innoUrl -OutFile "innosetup.exe" -UseBasicParsing
        
        Write-Host "🔧 安装 Inno Setup..."
        Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
        
        # 验证安装
        $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (Test-Path $innoPath) {
          Write-Host "✅ Inno Setup 安装成功"
        } else {
          Write-Error "❌ Inno Setup 安装失败"
          exit 1
        }
      shell: powershell
        
    - name: Create portable package
      run: |
        Write-Host "📦 创建便携版压缩包..."
        
        # 创建便携版目录
        $portableDir = "DNS-Tester-Portable"
        New-Item -ItemType Directory -Path $portableDir -Force
        
        # 复制文件到便携版目录
        Copy-Item "dist\${{ env.APP_NAME }}.exe" "$portableDir\"
        Copy-Item "dns_config.ini" "$portableDir\"
        Copy-Item "README.md" "$portableDir\"
        Copy-Item "LICENSE" "$portableDir\"
        
        # 创建便携版说明文件
        $portableReadme = @"
# DNS Tester 便携版

## 使用说明

这是 DNS Tester 的便携版本，无需安装即可使用。

### 文件说明
- DNS-Tester.exe - 主程序
- dns_servers.ini - DNS服务器配置文件
- README.md - 项目说明文档
- LICENSE - 许可证文件
- 便携版说明.txt - 本文件

### 使用方法
1. 直接双击 DNS-Tester.exe 运行程序
2. 首次运行可能需要管理员权限（用于修改系统DNS设置）
3. 程序配置会保存在当前目录下

### 系统要求
- Windows 10/11 (64位)
- 无需安装任何运行时或依赖

### 注意事项
- 便携版可以放在U盘等移动存储设备中使用
- 建议将整个文件夹复制到本地硬盘使用以获得最佳性能
- 如需卸载，直接删除整个文件夹即可

---
项目地址: https://github.com/pcoof/dns
"@
        $portableReadme | Out-File -FilePath "$portableDir\便携版说明.txt" -Encoding UTF8
        
        # 创建ZIP压缩包
        Compress-Archive -Path "$portableDir\*" -DestinationPath "DNS-Tester-Portable.zip" -Force
        
        if (Test-Path "DNS-Tester-Portable.zip") {
          $zipSize = (Get-Item "DNS-Tester-Portable.zip").Length / 1MB
          Write-Host "✅ 便携版压缩包创建成功，大小: $([math]::Round($zipSize, 2)) MB"
        } else {
          Write-Error "❌ 便携版压缩包创建失败"
          exit 1
        }
      shell: powershell
        
    - name: Create installer
      run: |
        Write-Host "📦 创建安装程序..."
        $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        & $innoPath "installer.iss"
        
        if (Test-Path "Output\DNS-Tester-Setup.exe") {
          $installerSize = (Get-Item "Output\DNS-Tester-Setup.exe").Length / 1MB
          Write-Host "✅ 安装程序创建成功，大小: $([math]::Round($installerSize, 2)) MB"
        } else {
          Write-Error "❌ 安装程序创建失败"
          exit 1
        }
      shell: powershell
      
    - name: Calculate checksums
      run: |
        Write-Host "🔐 计算文件校验和..."
        
        $setupHash = Get-FileHash "Output\DNS-Tester-Setup.exe" -Algorithm SHA256
        $zipHash = Get-FileHash "DNS-Tester-Portable.zip" -Algorithm SHA256
        
        $checksums = @"
        # DNS Tester 文件校验和
        
        ## SHA256 校验和
        
        ``````
        $($setupHash.Hash.ToLower())  DNS-Tester-Setup.exe
        $($zipHash.Hash.ToLower())  DNS-Tester-Portable.zip
        ``````
        
        ## 文件信息
        
        | 文件 | 大小 | 说明 |
        |------|------|------|
        | DNS-Tester-Setup.exe | $([math]::Round((Get-Item "Output\DNS-Tester-Setup.exe").Length / 1MB, 2)) MB | 安装版 - 包含预配置DNS列表 |
        | DNS-Tester-Portable.zip | $([math]::Round((Get-Item "DNS-Tester-Portable.zip").Length / 1MB, 2)) MB | 便携版 - 包含预配置DNS列表 |
        "@
        
        $checksums | Out-File -FilePath "checksums.txt" -Encoding UTF8
        Write-Host $checksums
      shell: powershell
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dns-tester-windows-${{ github.sha }}
        path: |
          Output/DNS-Tester-Setup.exe
          DNS-Tester-Portable.zip
          checksums.txt
        retention-days: 30
          
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Output/DNS-Tester-Setup.exe
          DNS-Tester-Portable.zip
          checksums.txt
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        generate_release_notes: true
        body: |
          ## 🚀 DNS Tester ${{ github.ref_name }}
          
          现代化的DNS服务器测试工具，专为Windows系统设计。
          
          ### 📥 下载说明
          
          | 文件 | 说明 | 推荐用户 |
          |------|------|----------|
          | `DNS-Tester-Portable.zip` | 📁 **便携版** - 解压即用，包含预配置DNS列表 | 一般用户、U盘携带、临时使用 |
          | `DNS-Tester-Setup.exe` | 📦 **安装版** - 完整安装包，含开始菜单和桌面快捷方式 | 长期使用、系统集成 |
          
          ### ✨ 主要功能
          
          - 🔍 **DNS延迟测试** - 实时测试DNS服务器响应时间
          - 🌐 **IPv4/IPv6支持** - 完整支持双栈网络环境  
          - 🔧 **网络适配器管理** - 智能检测和配置网络接口
          - ⚙️ **系统DNS设置** - 一键切换系统DNS配置
          - 🎨 **现代化界面** - 基于ttkbootstrap的美观UI
          - 📊 **多类别管理** - 支持DNS服务器分类管理
          
          ### 🔐 文件完整性验证
          
          下载后请验证文件SHA256校验和，详见 `checksums.txt` 文件。
          
          ### 💡 使用提示
          
          #### 便携版 (DNS-Tester-Portable.zip)
          1. 下载并解压到任意目录
          2. 双击 `DNS-Tester.exe` 运行程序
          3. 包含预配置的多类别DNS服务器列表
          4. 适合U盘携带和临时使用
          
          #### 安装版 (DNS-Tester-Setup.exe)
          1. 下载并运行安装程序
          2. 按提示完成安装
          3. 从开始菜单或桌面快捷方式启动
          4. 包含预配置的DNS服务器列表
          5. 支持标准卸载流程
          
          #### 配置文件特点
          - 两个版本都包含预配置的DNS服务器列表
          - 支持多个分类：默认、国内、国外、安全、游戏等
          - 用户可以自定义编辑配置文件
          - 配置文件位于程序目录下的 `dns_servers.ini`
          
          #### 系统要求
          - Windows 10/11 (64位)
          - 修改系统DNS设置需要管理员权限
          - 无需安装任何运行时或依赖库
          
          ---
          
          **🐛 问题反馈**: [GitHub Issues](https://github.com/pcoof/dns/issues)  
          **📖 使用文档**: [README.md](https://github.com/pcoof/dns#readme)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}