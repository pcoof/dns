name: Build and Release DNS Tester

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.13'
  APP_NAME: 'DNS-Tester'

jobs:
  quality:
    name: 代码检查与单元测试
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen --extra dev

      - name: Ruff 静态检查
        run: uv run ruff check .

      - name: Pytest 单元测试
        run: uv run pytest -q --no-cov

  build:
    name: 构建 Windows 产物
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（含构建工具）
        run: uv sync --frozen --extra build

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          $version = uv run python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          Write-Host "本次构建版本: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 使用 PyInstaller 打包
        shell: pwsh
        run: |
          Write-Host "构建可执行文件..."
          uv run pyinstaller --noconfirm --clean --onefile --noconsole `
            --icon "assets\icon.ico" `
            --add-data "assets\icon.ico;assets" `
            --name "${{ env.APP_NAME }}" `
            --hidden-import=tkinter `
            --hidden-import=tkinter.ttk `
            --hidden-import=ttkbootstrap `
            --hidden-import=dns `
            --hidden-import=dns.resolver `
            --hidden-import=pythoncom `
            --hidden-import=pywintypes `
            --hidden-import=win32api `
            --hidden-import=win32con `
            main.py

      - name: 校验可执行文件
        shell: pwsh
        run: |
          $exe = "dist\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "可执行文件构建失败: $exe 不存在"
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "构建成功: $exe ($size MB)"

      - name: 生成便携版压缩包
        shell: pwsh
        run: |
          $portableDir = "DNS-Tester-Portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null

          Copy-Item "dist\${{ env.APP_NAME }}.exe" $portableDir
          Copy-Item "dns_config.ini" $portableDir
          Copy-Item "README.md" $portableDir
          Copy-Item "LICENSE" $portableDir
          Copy-Item "assets\portable_readme.txt" "$portableDir\便携版说明.txt"

          # 预置空日志文件，避免首次运行时目录只读导致日志写入失败
          New-Item -ItemType File -Path "$portableDir\dns_tester.log" -Force | Out-Null

          Compress-Archive -Path "$portableDir\*" -DestinationPath "DNS-Tester-Portable.zip" -Force

          $size = [math]::Round((Get-Item "DNS-Tester-Portable.zip").Length / 1MB, 2)
          Write-Host "便携版打包完成 ($size MB)"

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "未检测到 Inno Setup，使用 Chocolatey 安装..."
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup 安装失败"
            exit 1
          }
          Write-Host "ISCC: $iscc"

      - name: 生成安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup 编译失败，退出码 $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path "Output\DNS-Tester-Setup.exe")) {
            Write-Error "安装包生成失败"
            exit 1
          }
          $size = [math]::Round((Get-Item "Output\DNS-Tester-Setup.exe").Length / 1MB, 2)
          Write-Host "安装包生成完成 ($size MB)"

      - name: 计算校验和
        shell: pwsh
        run: |
          $setup = Get-Item "Output\DNS-Tester-Setup.exe"
          $zip = Get-Item "DNS-Tester-Portable.zip"
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()

          $lines = @(
            "# DNS Tester ${{ steps.version.outputs.version }} 文件校验和",
            "",
            "## SHA256",
            "",
            '```',
            "$setupHash  DNS-Tester-Setup.exe",
            "$zipHash  DNS-Tester-Portable.zip",
            '```',
            "",
            "## 文件信息",
            "",
            "| 文件 | 大小 | 说明 |",
            "|------|------|------|",
            "| DNS-Tester-Setup.exe | $([math]::Round($setup.Length / 1MB, 2)) MB | 安装版 |",
            "| DNS-Tester-Portable.zip | $([math]::Round($zip.Length / 1MB, 2)) MB | 便携版 |",
            "",
            "构建时间: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss')) UTC",
            "提交: $env:GITHUB_SHA"
          )
          $lines | Out-File -FilePath "checksums.txt" -Encoding utf8
          Get-Content "checksums.txt"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dns-tester-windows-${{ steps.version.outputs.version }}
          path: |
            Output/DNS-Tester-Setup.exe
            DNS-Tester-Portable.zip
            checksums.txt
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: DNS Tester ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            Output/DNS-Tester-Setup.exe
            DNS-Tester-Portable.zip
            checksums.txt
          body: |
            ## DNS Tester ${{ steps.version.outputs.version }}

            现代化的 Windows DNS 服务器测试工具。

            ### 下载说明

            | 文件 | 说明 | 适用场景 |
            |------|------|----------|
            | `DNS-Tester-Portable.zip` | 便携版，解压即用，含预配置 DNS 列表 | U 盘携带、临时使用 |
            | `DNS-Tester-Setup.exe` | 安装版，含开始菜单与桌面快捷方式 | 长期使用、系统集成 |

            ### 主要功能

            - DNS 延迟测试：实时对比主备 DNS 响应时间
            - IPv4 / IPv6 双栈支持
            - 网络适配器识别与一键切换系统 DNS
            - 多分类 DNS 列表管理与历史记录
            - 基于 ttkbootstrap 的多主题界面

            ### 使用提示

            1. 便携版解压后双击 `DNS-Tester.exe` 运行
            2. 修改系统 DNS 需要管理员权限，程序会自动请求提权
            3. 配置、历史与日志均保存在程序所在目录

            ### 文件校验

            下载后可用 `checksums.txt` 中的 SHA256 校验文件完整性。

            ### 系统要求

            - Windows 10 / 11（64 位）
            - 无需安装 Python 或任何运行时

            ---

            问题反馈：https://github.com/pcoof/dns/issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
